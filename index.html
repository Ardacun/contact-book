<!DOCTYPE html>
<html lang="fr">
<head>
    <!-- Métadonnées essentielles -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- Titre de la page -->
    <title>Contact Book - Gestion de Contacts</title>
    
    <!-- Feuille de styles -->
    <link href="css/styles.css" rel="stylesheet">
</head>
<body>
    <!-- Conteneur principal de l'application -->
    <div class="container">
        
        <!-- En-tête avec titre et bouton d'ajout -->
        <header class="header">
            <h1>Contact book</h1>
            <button class="btn-add" id="btnAdd" aria-label="Ajouter un contact">+</button>
        </header>

        <!-- Section principale : tableau des contacts -->
        <main class="contacts-table">
            <table>
                <!-- En-tête du tableau -->
                <thead>
                    <tr>
                        <th scope="col">Nom</th>
                        <th scope="col">Prénom</th>
                        <th scope="col">Email</th>
                        <th scope="col">Téléphone</th>
                    </tr>
                </thead>
                <!-- Corps du tableau (rempli dynamiquement par JavaScript) -->
                <tbody id="contactsTableBody">
                </tbody>
            </table>
        </main>

        <!-- Pied de page avec copyright -->
        <footer class="footer">
            <p>&copy; 2025 - Acme Corp.</p>
        </footer>
    </div>

    <!-- Modal d'ajout de contact (fenêtre popup) -->
    <aside class="modal-overlay" id="modalOverlay" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
        <div class="modal">
            <!-- En-tête de la modal -->
            <header class="modal-header">
                <h2 class="modal-title" id="modalTitle">Ajouter un contact</h2>
                <button class="btn-close" id="btnClose" aria-label="Fermer la fenêtre">×</button>
            </header>

            <!-- Formulaire d'ajout de contact -->
            <form id="contactForm" novalidate>
                
                <!-- Champ Nom -->
                <div class="form-group">
                    <label for="nom">Nom :</label>
                    <input 
                        type="text" 
                        id="nom" 
                        name="nom" 
                        required >
                </div>

                <!-- Champ Prénom -->
                <div class="form-group">
                    <label for="prenom">Prénom :</label>
                    <input 
                        type="text" 
                        id="prenom" 
                        name="prenom" 
                        placeholder="Stylish Opossum" 
                        required
                        autocomplete="given-name">
                </div>

                <!-- Champ Email -->
                <div class="form-group">
                    <label for="email">Email :</label>
                    <input 
                        type="email" 
                        id="email" 
                        name="email" 
                        required 
                        placeholder="exemple@domaine.fr">
                </div>

                <!-- Champ Téléphone -->
                <div class="form-group">
                    <label for="telephone">Téléphone :</label>
                    <input 
                        type="tel" 
                        id="telephone" 
                        name="telephone" 
                        required 
                        placeholder="0123456789">
                </div>

                <!-- Bouton de validation -->
                <button 
                    type="submit" 
                    class="btn-submit" 
                    id="btnSubmit" 
                    disabled 
                    aria-disabled="true">
                    Valider
                </button>
            </form>
        </div>
    </aside>

    <!-- Script JavaScript -->
    <script src="js/formHandler.js"></script>
</body>
</html>
